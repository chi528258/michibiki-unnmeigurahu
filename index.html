<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>michibiki｜3年間の運気グラフ</title>
<style>
:root{--pink:#d95778;--ink:#55434a;--line:#ead1d4}*{box-sizing:border-box}body{margin:0;background:#fff7f5;color:var(--ink);font-family:"Yu Mincho",serif}.editor{max-width:900px;margin:24px auto;padding:22px;background:#fffaf8;border:1px solid #f0dadd;border-radius:18px;box-shadow:0 5px 24px #8c566018}.brand{text-align:center;color:#b94c6b;font-style:italic;letter-spacing:5px}.title{text-align:center;color:#a83e60;font-size:30px;margin:4px 0}.sub{text-align:center;color:#b77b86;margin:0 0 20px}.panel{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;background:#fffdfb}.panel h2{font-size:18px;margin:0 0 12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:14px}input,select,textarea{width:100%;padding:10px;border:1px solid #d9bfc3;border-radius:8px;background:white;color:var(--ink);font:inherit;margin-top:5px}.years{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.chart-wrap{overflow-x:auto}.chart{width:100%;min-width:320px;height:auto;display:block}.memo textarea{min-height:105px;resize:vertical}.actions{display:flex;gap:12px;justify-content:center;margin:18px 0}.btn{border:0;border-radius:24px;padding:12px 28px;background:var(--pink);color:white;font:inherit;cursor:pointer}.btn.secondary{background:white;color:#986c74;border:1px solid #d9bfc3}.hint{font-size:12px;color:#987d82;text-align:center}.report{display:none}.report-sheet{width:210mm;min-height:297mm;margin:20px auto;padding:13mm;background:#fffaf8;border:1px solid #e8c6cc;position:relative}.report-sheet:before{content:"";position:absolute;inset:5mm;border:1px solid #efd9dc;pointer-events:none}.report-sheet .title{font-size:28px}.report-meta{text-align:center;margin:10px 0 16px}.report-memo{white-space:pre-wrap;border:1px solid #ead1d4;border-radius:10px;padding:14px;min-height:45px;margin-top:16px}.report-memo:empty{display:none}.foot{text-align:center;color:#b77b86;letter-spacing:4px;margin-top:18px}
@media(max-width:600px){.editor{margin:10px;padding:14px}.title{font-size:24px}.fields{grid-template-columns:1fr}.years{gap:7px}.years label{font-size:13px}.years select{font-size:12px;padding:8px}}
@media print{@page{size:A4 portrait;margin:0}.editor{display:none!important}.report{display:block!important}.report-sheet{margin:0;width:210mm;height:297mm;min-height:297mm;border:0;page-break-after:always;break-after:page}.report-sheet:last-child{page-break-after:auto;break-after:auto}body{background:white;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="editor"><div class="brand">michibiki</div><h1 class="title">3年間の運気グラフ</h1><p class="sub">〜 あなたの流れを見てみましょう 〜</p>
<section class="panel"><h2>お名前・生年月日（任意）</h2><div class="fields"><label>お名前<input id="name" placeholder="お名前"></label><label>生年月日<input id="birth" type="date"></label></div></section>
<section class="panel"><h2>3年間の星を選択</h2><div class="years"><label>2026年<select id="y2026"></select></label><label>2027年<select id="y2027"></select></label><label>2028年<select id="y2028"></select></label></div></section>
<section class="panel"><h2>運気グラフ（プレビュー）</h2><div class="chart-wrap" id="preview"></div><p class="hint">上が高く、下が低い位置です。①が最も高く、⑫が最も低くなります。</p></section>
<section class="panel memo"><h2>メモ（自由入力）</h2><textarea id="memo" placeholder="天冲殺・出会いあり！など自由に入力してください"></textarea></section>
<div class="actions"><button class="btn" onclick="makeReport()">鑑定書を作成・印刷</button><button class="btn secondary" onclick="resetForm()">入力をリセット</button></div><p class="hint">「鑑定書を作成・印刷」から、印刷画面でPDFとして保存できます。</p></div>
<div class="report" id="report"><article class="report-sheet"><div class="brand">michibiki</div><h1 class="title">3年間の運気グラフ</h1><p class="sub">〜 これからの3年間の流れを見てみましょう 〜</p><div class="report-meta" id="meta"></div><div id="finalChart"></div><div class="report-memo" id="finalMemo"></div><div class="foot">michibiki 〜 自分らしい幸せへの道しるべ 〜</div></article></div>
<script>
const stars=[['天報星','胎児（母の体内にいる前世の時代）'],['天印星','赤子（誕生してから3歳くらいまで）'],['天貴星','幼児（幼稚園児から小学校低学年）'],['天恍星','少年（小学校高学年から中学時代）'],['天南星','青年（高校から大学時代または29歳まで）'],['天禄星','壮年（30歳から49歳まで）'],['天將星','大将（50歳から60歳の定年前）'],['天堂星','老人（60歳以降、または定年後）'],['天胡星','病人（体力が衰えて病床にある時代）'],['天極星','死人（生命の終局、来世への出発）'],['天庫星','入墓（墓に入り、来世へ旅立つ時代）'],['天馳星','あの世（来世をさまよう時代）']];
const ids=['y2026','y2027','y2028'];ids.forEach(id=>{const s=document.getElementById(id);stars.forEach((v,i)=>{let o=document.createElement('option');o.value=i+1;o.textContent=`${i+1} ${v[0]}`;s.append(o)});s.addEventListener('change',drawPreview)});
function values(){return ids.map(id=>+document.getElementById(id).value)}
function chart(){let vals=values(),W=760,H=540,left=205,right=25,top=22,bottom=62,gw=W-left-right,gh=H-top-bottom;let y=n=>top+(n-1)*gh/11;let x=i=>left+gw*(i+.5)/3;let bands=stars.map((s,i)=>`<rect x="${left}" y="${y(i+1)-gh/22}" width="${gw}" height="${gh/11}" fill="${i%2?'#fff1ec':'#fce7e8'}" opacity=".9"/>`).join('');let labels=stars.map((s,i)=>`<text x="12" y="${y(i+1)+6}" font-size="17" fill="#55434a">${i+1}　${s[0]}（${s[1].split('（')[0]}）</text>`).join('');let grid=[0,1,2].map(i=>`<line x1="${x(i)}" y1="${top}" x2="${x(i)}" y2="${top+gh}" stroke="#d9c7c8" stroke-dasharray="4 4"/><text x="${x(i)}" y="${H-22}" text-anchor="middle" font-size="18" fill="#55434a">${2026+i}年</text>`).join('');let pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');let dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="9" fill="#e64f7b" stroke="white" stroke-width="3"/><text x="${x(i)}" y="${y(v)-16}" text-anchor="middle" font-size="14" fill="#a83e60">${v} ${stars[v-1][0]}</text>`).join('');return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="3年間の運気グラフ">${bands}${grid}${labels}<polyline points="${pts}" fill="none" stroke="#e64f7b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`}
function drawPreview(){document.getElementById('preview').innerHTML=chart()}function makeReport(){document.getElementById('meta').textContent=[document.getElementById('name').value,document.getElementById('birth').value].filter(Boolean).join('　｜　');document.getElementById('finalChart').innerHTML=chart();document.getElementById('finalMemo').textContent=document.getElementById('memo').value;window.print()}function resetForm(){document.getElementById('name').value='';document.getElementById('birth').value='';ids.forEach(id=>document.getElementById(id).value='1');document.getElementById('memo').value='';drawPreview()}drawPreview();
</script></body></html>
